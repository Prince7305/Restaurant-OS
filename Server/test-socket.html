<!DOCTYPE html>
<html>

<head>
    <title>Kitchen Dashboard - Socket Test</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f4f4f4;
        }

        #log {
            background: #fff;
            border: 1px solid #ccc;
            padding: 15px;
            margin-top: 15px;
            border-radius: 6px;
        }

        .event {
            padding: 8px;
            margin-bottom: 6px;
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
        }

        .status {
            font-weight: bold;
            color: green;
        }
    </style>
</head>

<body>
    <h2>RestaurantOS - Kitchen Live Test</h2>
    <p class="status" id="connectionStatus">Connecting...</p>

    <div id="log"><strong>Live Events:</strong></div>

    <script>
        // Change this to your actual restaurantId
        const RESTAURANT_ID = "6aa68bdb707d77bf54bcfada";

        const socket = io("http://localhost:5000");

        socket.on("connect", () => {
            document.getElementById("connectionStatus").innerText = "Connected! Socket ID: " + socket.id;
            // Tell the server which restaurant's room this client belongs to
            socket.emit("joinRestaurant", RESTAURANT_ID);
        });

        socket.on("newOrder", (order) => {
            logEvent("NEW ORDER received: Table " + order.tableId + " - Total: Rs " + order.totalAmount);
        });

        socket.on("orderStatusUpdated", (order) => {
            logEvent("STATUS UPDATED: Order " + order._id + " is now " + order.status);
        });

        function logEvent(text) {
            const div = document.createElement("div");
            div.className = "event";
            div.innerText = new Date().toLocaleTimeString() + " - " + text;
            document.getElementById("log").appendChild(div);
        }
    </script>
</body>

</html>
